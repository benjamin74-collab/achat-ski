name: Catalog Sync

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:
    inputs:
      feedSourceId:
        description: "ID du flux à importer. Laisser vide pour les flux dus."
        required: false
        type: string
      mode:
        description: "Mode pour un flux manuel"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - delta
      maxFeeds:
        description: "Nombre maximum de flux dus à traiter"
        required: true
        default: "20"
        type: string

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  select-feeds:
    name: Select due feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      feeds: ${{ steps.select.outputs.feeds }}
      count: ${{ steps.select.outputs.count }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Select feeds
        id: select
        env:
          NODE_ENV: production
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FEED_SOURCE_ID: ${{ inputs.feedSourceId }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_FEEDS: ${{ inputs.maxFeeds }}
        run: npx tsx prisma/select-due-feed-sources.ts

  import-feed:
    name: "Import feed ${{ matrix.feed.id }}"
    needs: select-feeds
    if: needs.select-feeds.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        feed: ${{ fromJSON(needs.select-feeds.outputs.feeds) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Import selected feed
        env:
          FEED_SOURCE_ID: ${{ matrix.feed.id }}
          FEED_SYNC_MODE: ${{ matrix.feed.mode }}
          FEED_TRIGGER: ${{ matrix.feed.trigger }}
        run: npm run catalog:sync:feed
